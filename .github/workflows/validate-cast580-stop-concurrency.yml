name: Validate Cast STOP concurrency

on:
  push:
    branches:
      - validation/cast580-stop-concurrency-run-20261005

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run focused Cast STOP reply suite
        run: |
          ./gradlew :play-services-cast-core:testDebugUnitTest \
            --tests org.microg.gms.cast.channel.CastDeviceSessionStopReplyTest \
            --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx2g"
