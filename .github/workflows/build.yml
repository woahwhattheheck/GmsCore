name: Cancel superseded Wear leaf runs 4545

on:
  push:
    branches: [ops/cancel-wear-leaf-runs-20261004-4545]
    paths: [.github/workflows/build.yml]

permissions: {}

jobs:
  cancel-superseded-runs:
    if: github.repository == 'woahwhattheheck/GmsCore' && github.ref == 'refs/heads/ops/cancel-wear-leaf-runs-20261004-4545'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Verify and cancel the three superseded leaf runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          repository = "woahwhattheheck/GmsCore"
          branch = "bounty/wear2843-listener-dispatch-c361-20261004"
          targets = {
              37185978724: ("0fa1ae2a8741c954fa299e29079e0b2ef8dd1b13", "push"),
              37186218073: ("fcd646cb624aa792877a7d8173b4677d80a01f8f", "push"),
              37186220657: ("fcd646cb624aa792877a7d8173b4677d80a01f8f", "pull_request"),
          }
          if os.environ.get("GITHUB_REPOSITORY") != repository:
              sys.exit("Unexpected execution repository")
          if os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
              sys.exit("This one-time cleanup must not be rerun")

          def request(run_id, *, cancel=False):
              suffix = "/cancel" if cancel else ""
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/runs/{run_id}{suffix}",
                  data=b"" if cancel else None,
                  method="POST" if cancel else "GET",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  exc.close()
                  return status, {}

          def inspect(run_id):
              status, run = request(run_id)
              if status != 200:
                  sys.exit(f"Read failed for {run_id}: HTTP {status}")
              sha, event = targets[run_id]
              expected = {
                  "id": run_id,
                  "head_branch": branch,
                  "head_sha": sha,
                  "event": event,
                  "run_attempt": 1,
                  "path": ".github/workflows/build.yml",
              }
              for key, value in expected.items():
                  if run.get(key) != value:
                      sys.exit(f"Refusing changed target {run_id}: {key} mismatch")
              if any(run.get(key, {}).get("full_name") != repository
                     for key in ("repository", "head_repository")):
                  sys.exit(f"Refusing foreign target {run_id}")
              if run.get("status") not in {"completed", "queued", "in_progress", "requested", "waiting", "pending"}:
                  sys.exit(f"Unexpected target status for {run_id}")
              return run

          # Validate the entire pinned scope before sending any cancellation.
          observations = {run_id: inspect(run_id) for run_id in targets}
          results = []
          for run_id, run in observations.items():
              if run["status"] == "completed":
                  results.append({"id": run_id, "action": "already_completed", "conclusion": run.get("conclusion")})
                  continue
              status, _ = request(run_id, cancel=True)
              if status not in {202, 409}:
                  sys.exit(f"Cancellation rejected for {run_id}: HTTP {status}")
              current = inspect(run_id)
              if status == 409 and current["status"] != "completed":
                  sys.exit(f"Unresolved cancellation conflict for {run_id}")
              results.append({
                  "id": run_id,
                  "action": "cancellation_accepted" if status == 202 else "completed_during_request",
                  "http_status": status,
                  "observed_status": current["status"],
                  "conclusion": current.get("conclusion"),
              })
          print(json.dumps({"repository": repository, "results": results}, sort_keys=True))
