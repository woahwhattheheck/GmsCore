name: Wear 3852 wake-lock deadline validation
permissions:
  contents: read
on:
  push:
    branches: ["validate/wear3852-wakelock-solhawthorn-20261004"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9645019dbd7d92205c6fe42d5f276a15ad5c176f
          fetch-depth: 1
      - name: Verify source pin
        run: |
          test "$(git rev-parse HEAD)" = "9645019dbd7d92205c6fe42d5f276a15ad5c176f"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Run focused WakeLockManager regression
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-configuration-cache :play-services-wearable-core:testDebugUnitTest --tests org.microg.gms.wearable.bluetooth.WakeLockManagerTest
