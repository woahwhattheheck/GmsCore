name: Cast 580 listener lifecycle tests

on:
  push:
    branches:
      - validation/cast580-lifecycle-7c63414ea055

permissions:
  contents: read

jobs:
  cast-lifecycle-tests:
    name: Cast controller listener lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run the two controller lifecycle tests
        run: |
          cat > "$RUNNER_TEMP/cast580-lifecycle.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(Test).configureEach {
                  maxHeapSize = '512m'
                  maxParallelForks = 1
                  systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
              }
          }
          GRADLE
          ./gradlew :play-services-cast-core:testDebugUnitTest \
            --tests 'org.microg.gms.cast.CastDeviceControllerLifecycleTest' \
            --no-daemon --max-workers=2 --console=plain --no-configuration-cache \
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:+UseParallelGC' \
            -Pkotlin.compiler.execution.strategy=in-process \
            --init-script "$RUNNER_TEMP/cast580-lifecycle.gradle" --stacktrace
      - name: Upload lifecycle JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cast580-lifecycle-junit-7c63414ea055
          path: play-services-cast/core/build/test-results/testDebugUnitTest/TEST-org.microg.gms.cast.CastDeviceControllerLifecycleTest.xml
          if-no-files-found: error
          retention-days: 14
