name: "Dott #3841 project test classpath validation"
on:
  push:
    branches: ['validation/dott3841-integrated-cd79-20261004']
    paths: ['.github/workflows/build.yml']
permissions:
  contents: read
concurrency:
  group: dott3841-integrated
  cancel-in-progress: false
jobs:
  dott-integrated:
    if: github.repository == 'woahwhattheheck/GmsCore' && github.ref == 'refs/heads/validation/dott3841-integrated-cd79-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: '1'
      VALIDATION_SOURCE_SHA: 'e5208cbd1dfd316c4032d10ca4745242fe3702c5'
      VALIDATION_SOURCE_TREE: '4866ca63ddd39f343bbe5c08a3c40a576d947e0d'
      EVIDENCE_DIR: /tmp/dott3841-project-module-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Start execution receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,os,time
          from pathlib import Path
          out=Path(os.environ["EVIDENCE_DIR"]);out.mkdir(parents=True,exist_ok=True)
          receipt={"started_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   "started_monotonic_ns":time.monotonic_ns(),
                   "workflow_commit":os.environ["GITHUB_SHA"],
                   "workflow_ref":os.environ["GITHUB_REF"],
                   "run_url":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
                   "run_attempt":os.environ["GITHUB_RUN_ATTEMPT"]}
          (out/"execution-start.json").write_text(json.dumps(receipt,indent=2)+"\n")
          PY
      - name: Checkout exact project source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VALIDATION_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record source and tree
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          git=lambda *args:subprocess.check_output(["git",*args],text=True).strip()
          source={"expected_commit":os.environ["VALIDATION_SOURCE_SHA"],"expected_tree":os.environ["VALIDATION_SOURCE_TREE"],
                  "actual_commit":git("rev-parse","HEAD"),"actual_tree":git("rev-parse","HEAD^{tree}"),
                  "build_gradle_blob":git("hash-object","play-services-droidguard/core/build.gradle")}
          source["matches"]=(source["expected_commit"]==source["actual_commit"] and source["expected_tree"]==source["actual_tree"]
                             and source["build_gradle_blob"]=="04a4c63c7294ba98591fd58c15b03c391b8882d3")
          (Path(os.environ["EVIDENCE_DIR"])/"source.json").write_text(json.dumps(source,indent=2)+"\n")
          print(json.dumps(source))
          if not source["matches"]:raise SystemExit("Source pin mismatch")
          PY
      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Ensure Android 35 build components
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$ANDROID_HOME"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if ! test -x "$manager"; then manager="$(command -v sdkmanager)"; fi
          if ! test -f "$sdk_root/platforms/android-35/android.jar" || ! test -x "$sdk_root/build-tools/35.0.0/aapt2"; then
            "$manager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk_root/platforms/android-35/android.jar"
          test -x "$sdk_root/build-tools/35.0.0/aapt2"
      - name: Record toolchain
        shell: bash
        run: |
          {
            date -u +%Y-%m-%dT%H:%M:%SZ
            uname -a
            java -version
            javac -version
            java --list-modules
            cat gradle/wrapper/gradle-wrapper.properties
            cat "$ANDROID_HOME/platforms/android-35/source.properties"
            cat "$ANDROID_HOME/build-tools/35.0.0/source.properties"
          } > "$EVIDENCE_DIR/toolchain.log" 2>&1
      - name: Add JDK HTTP server jar to the unit-test classpath
        shell: bash
        run: |
          set -euo pipefail
          module="$JAVA_HOME/jmods/jdk.httpserver.jmod"
          test -f "$module"
          module_dir="$EVIDENCE_DIR/jdk-httpserver-module"
          mkdir -p "$module_dir"
          "$JAVA_HOME/bin/jmod" extract --dir "$module_dir" "$module"
          test -f "$module_dir/classes/com/sun/net/httpserver/HttpServer.class"
          jar_file="$EVIDENCE_DIR/jdk-httpserver-test.jar"
          "$JAVA_HOME/bin/jar" --create --file "$jar_file" -C "$module_dir/classes" com/sun/net/httpserver
          test -s "$jar_file"
          printf 'DOTT_JDK_HTTP_SERVER_JAR=%s\n' "$jar_file" >> "$GITHUB_ENV"
          sha256sum "$module" "$jar_file" > "$EVIDENCE_DIR/jdk-httpserver-classpath.log"
          cat > "$EVIDENCE_DIR/dott-test-classpath.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              def target = gradle.rootProject.findProject(':play-services-droidguard-core')
              if (target == null) throw new GradleException('DroidGuard core project is missing.')
              def jarPath = System.getenv('DOTT_JDK_HTTP_SERVER_JAR')
              def jar = jarPath ? new File(jarPath) : null
              if (jar == null || !jar.isFile()) throw new GradleException('Test-only JDK HTTP server jar is missing.')
              target.dependencies.add('testImplementation', target.files(jar))
              target.tasks.matching { it.name == 'compileDebugUnitTestKotlin' || it.name == 'compileDebugUnitTestJavaWithJavac' || it.name == 'testDebugUnitTest' }.configureEach {
                  dependsOn(target.tasks.named('prepareHttpServerTestApi'))
              }
              target.tasks.named('testDebugUnitTest').configure {
                  jvmArgs '--add-modules=jdk.httpserver'
                  doFirst {
                      println '--add-modules=jdk.httpserver'
                      println 'DOTT_TEST_ONLY_CLASS_PATH=' + jarPath
                  }
              }
          }
          GRADLE
      - name: Run normal DroidGuard module unit-test task
        id: build
        shell: bash
        run: |
          set -euo pipefail
          export DOTT_BUILD_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export DOTT_BUILD_STARTED_EPOCH="$(date +%s)"
          set +e
          ./gradlew --no-daemon --console=plain --max-workers=1 --no-parallel --info --stacktrace \
            -I "$EVIDENCE_DIR/dott-test-classpath.init.gradle" \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' \
            -Pkotlin.compiler.execution.strategy=in-process \
            :play-services-droidguard-core:testDebugUnitTest \
            2>&1 | tee "$EVIDENCE_DIR/gradle.log"
          dott_exit="${PIPESTATUS[0]}"
          set -e
          export DOTT_BUILD_EXIT="$dott_exit"
          python3 - <<'PY'
          import datetime,json,os,time
          from pathlib import Path
          receipt={"started_at":os.environ["DOTT_BUILD_STARTED_AT"],
                   "ended_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   "elapsed_seconds":round(time.time()-int(os.environ["DOTT_BUILD_STARTED_EPOCH"]),3),
                   "exit_code":int(os.environ["DOTT_BUILD_EXIT"]),
                   "source_commit":os.environ["VALIDATION_SOURCE_SHA"],"source_tree":os.environ["VALIDATION_SOURCE_TREE"],
                   "tasks":[":play-services-droidguard-core:testDebugUnitTest"],
                   "test_filters":[],"init_scripts":["dott-test-classpath.init.gradle"],"source_patch":[],"apk_assembly":False,
                   "gradle_jvmargs":"-Xmx3g -XX:MaxMetaspaceSize=768m","max_workers":1,
                   "kotlin_compiler_execution_strategy":"in-process",
                   "test_classpath":"jdk.httpserver jar on testImplementation plus pinned prepareHttpServerTestApi"}
          (Path(os.environ["EVIDENCE_DIR"])/"build.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt))
          PY
          exit "$dott_exit"
      - name: Retain all test XML and source-bound evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,shutil,subprocess,time
          import xml.etree.ElementTree as ET
          from pathlib import Path
          out=Path(os.environ["EVIDENCE_DIR"]);out.mkdir(parents=True,exist_ok=True)
          problems=[];files=[]
          def retain(path):
            target=out/"files"/path;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(path,target)
            item={"path":str(Path("files")/path),"bytes":target.stat().st_size,
                  "sha256":hashlib.sha256(target.read_bytes()).hexdigest()}
            files.append(item);return item
          counts={};totals={"tests":0,"failures":0,"errors":0,"skipped":0,"report_files":0}
          for report in sorted(Path("play-services-droidguard/core/build/test-results/testDebugUnitTest").glob("TEST-*.xml")):
            retain(report);totals["report_files"]+=1
            try:root=ET.parse(report).getroot()
            except ET.ParseError:problems.append("Invalid XML: "+str(report));continue
            for case in root.iter("testcase"):
              name=case.get("classname");counts[name]=counts.get(name,0)+1;totals["tests"]+=1
              for kind in ("failure","error","skipped"):
                totals[{"failure":"failures","error":"errors","skipped":"skipped"}[kind]]+=len(case.findall(kind))
          for name in ("RemoteDroidGuardInitializationTest","RemoteDroidGuardSessionTest","RemoteDroidGuardHttpClientTest","RemoteDroidGuardHandleInteropTest"):
            if not counts.get("org.microg.gms.droidguard.core."+name):problems.append("No executed maintained class: "+name)
          if totals["failures"] or totals["errors"] or totals["skipped"]:problems.append("Unit tests failed, errored or skipped")
          if totals["tests"]==0:problems.append("No executed cases")
          api=Path("play-services-droidguard/core/build/jdk-httpserver-test/api")
          api_files=sorted(api.rglob("*.class"))
          if not (api/"com/sun/net/httpserver/HttpServer.class").is_file():problems.append("Generated test API missing")
          if any(not str(p.relative_to(api)).startswith("com/sun/net/httpserver/") for p in api_files):problems.append("Non-public package in test compile-only API")
          api_manifest=[{"path":str(p.relative_to(api)),"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in api_files]
          (out/"test-api-classes.json").write_text(json.dumps(api_manifest,indent=2)+"\n")
          retain(Path("play-services-droidguard/core/build.gradle"))
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          if changed:problems.append("Unexpected source delta after build: "+repr(changed))
          source=json.loads((out/"source.json").read_text()) if (out/"source.json").is_file() else {}
          build=json.loads((out/"build.json").read_text()) if (out/"build.json").is_file() else {}
          start=json.loads((out/"execution-start.json").read_text()) if (out/"execution-start.json").is_file() else {}
          if not source.get("matches"):problems.append("Source pin unconfirmed")
          if build.get("exit_code")!=0:problems.append("Gradle exit not zero")
          log=(out/"gradle.log").read_text(errors="replace") if (out/"gradle.log").is_file() else ""
          runtime_module_arg="--add-modules=jdk.httpserver" in log
          if not runtime_module_arg:problems.append("Test JVM module argument missing from --info log")
          summary={"source":source,"build":build,"junit":totals,"class_counts":counts,
                   "generated_api_class_count":len(api_files),"test_jvm_module_argument_observed":runtime_module_arg,
                   "source_delta_after_build":changed,"problems":problems,
                   "execution":{**start,"ended_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                                "elapsed_seconds":round((time.monotonic_ns()-start["started_monotonic_ns"])/1e9,3) if "started_monotonic_ns" in start else None},
                   "device_result":"not executed"}
          (out/"summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          for p in sorted(out.glob("*.json"))+sorted(out.glob("*.log")):
            files.append({"path":p.name,"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/"SHA256SUMS").write_text("".join(f"{x['sha256']}  {x['path']}\n" for x in files))
          print(json.dumps(summary,indent=2))
          if problems:raise SystemExit(1)
          PY
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dott3841-project-jdkmodule-${{ env.VALIDATION_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
