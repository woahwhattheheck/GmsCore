name: Wear retained lint artifact read
permissions:
  actions: read
on:
  push:
    branches: ["validate/wear3852-1062b78d-b35f-20261004"]
jobs:
  read-retained-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read only completed artifact and verify hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,urllib.error,zipfile
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          request=urllib.request.Request("https://api.github.com/repos/woahwhattheheck/GmsCore/actions/artifacts/11305708683/zip",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          try:
              response=opener.open(request,timeout=60)
          except urllib.error.HTTPError as exc:
              if exc.code!=302: raise
              location=exc.headers["Location"]
              response=urllib.request.urlopen(location,timeout=60)
          target=pathlib.Path("retained-validation.zip")
          h=hashlib.sha256()
          with response,target.open("wb") as f:
              for block in iter(lambda:response.read(1048576),b""): f.write(block);h.update(block)
          result={"artifact_id":11305708683,"archive_bytes":target.stat().st_size,"archive_sha256":h.hexdigest(),"lint_reports":{},"apks":[]}
          with zipfile.ZipFile(target) as z:
              for name in z.namelist():
                  if "/lint/" in "/"+name: result["lint_reports"][name]=z.read(name).decode()
                  elif name.endswith(".apk"):
                      digest=hashlib.sha256()
                      with z.open(name) as f:
                          for b in iter(lambda:f.read(1048576),b""): digest.update(b)
                      result["apks"].append({"path":name,"bytes":z.getinfo(name).file_size,"sha256":digest.hexdigest()})
          print("RETAINED_ARTIFACT_JSON_BEGIN")
          print(json.dumps(result))
          print("RETAINED_ARTIFACT_JSON_END")
          
          PY
