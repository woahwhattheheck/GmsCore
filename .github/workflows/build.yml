name: "Dott linked TCP JSON contract"
on:
  push:
    branches: ['validation/dott3841-linked-tcp-20261004']
    paths: ['.github/workflows/build.yml']
permissions:
  contents: read
concurrency:
  group: dott3841-linked-tcp
  cancel-in-progress: false
jobs:
  tcp-protocol-contract:
    if: github.repository == 'woahwhattheheck/GmsCore' && github.ref == 'refs/heads/validation/dott3841-linked-tcp-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HARNESS_SHA256: '5fda86344bd13b62499c65442dfcd90b71bc9eb44cf142cc2c0758c170d1de99'
      HARNESS_BASE64: ''
      EVIDENCE_DIR: /tmp/dott-tcp-contract-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact validation controller
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact issue-linked relay source
        uses: actions/checkout@v7
        with:
          repository: kaduvert/PlayIntegrityServer
          ref: 8a14fde55b52c6e2aad98f50dbb10d69d6a2f684
          path: linked-playintegrity
          fetch-depth: 1
          persist-credentials: false
      - name: Reconstruct exact prepared contract harness
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          data=base64.b64decode(os.environ["HARNESS_BASE64"],validate=True)
          if hashlib.sha256(data).hexdigest()!=os.environ["HARNESS_SHA256"]:raise SystemExit("Harness byte mismatch")
          target=Path(os.environ["EVIDENCE_DIR"])/"test_playintegrity_tcp_contract.py"
          target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          with open(os.environ["GITHUB_ENV"],"a") as env:env.write("HARNESS_FILE="+str(target)+"\n")
          print("Harness SHA256 "+hashlib.sha256(data).hexdigest())
          PY
      - name: Record both source pins and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/baseline" "$EVIDENCE_DIR/header-candidate"
          { python3 --version; g++ --version; uname -a; } > "$EVIDENCE_DIR/toolchain.log" 2>&1
          python3 - <<'PY'
          import datetime,hashlib,json,os,subprocess
          from pathlib import Path
          git=lambda folder,*args:subprocess.check_output(["git","-C",folder,*args],text=True).strip()
          receipt={"controller_commit":git(".","rev-parse","HEAD"),"controller_tree":git(".","rev-parse","HEAD^{tree}"),
                   "harness_sha256":hashlib.sha256(Path(os.environ["HARNESS_FILE"]).read_bytes()).hexdigest(),
                   "linked_commit":git("linked-playintegrity","rev-parse","HEAD"),
                   "linked_tree":git("linked-playintegrity","rev-parse","HEAD^{tree}"),
                   "workflow_commit":os.environ["GITHUB_SHA"],"workflow_ref":os.environ["GITHUB_REF"],
                   "run_url":os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
                   "started_at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          if receipt["controller_commit"]!=os.environ["GITHUB_SHA"]:raise SystemExit("Controller pin mismatch")
          if receipt["harness_sha256"]!=os.environ["HARNESS_SHA256"]:raise SystemExit("Harness pin mismatch")
          if receipt["linked_commit"]!="8a14fde55b52c6e2aad98f50dbb10d69d6a2f684":raise SystemExit("Linked commit mismatch")
          if receipt["linked_tree"]!="7f18af46f23a58e82474734b2ea47f5d2a78185e":raise SystemExit("Linked tree mismatch")
          (Path(os.environ["EVIDENCE_DIR"])/"source.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt))
          PY
      - name: Clean-source host probe and explicit header candidate
        shell: bash
        run: |
          set -euo pipefail
          export PLAYINTEGRITY_SOURCE_DIR="$GITHUB_WORKSPACE/linked-playintegrity"
          export PLAYINTEGRITY_PROTOCOL_EVIDENCE="$EVIDENCE_DIR/baseline"
          export PLAYINTEGRITY_HEADER_REPAIR=0
          set +e
          python3 "$HARNESS_FILE" -v \
            2>&1 | tee "$EVIDENCE_DIR/baseline/unittest.log"
          baseline_exit="${PIPESTATUS[0]}"
          set -e
          export TCP_BASELINE_EXIT="$baseline_exit"
          if test "$baseline_exit" -eq 0; then
            echo "TCP_ACTUAL_EVIDENCE=baseline" >> "$GITHUB_ENV"
            echo "TCP_ACTUAL_EXIT=0" >> "$GITHUB_ENV"
          else
            grep -q 'PRIu64' "$EVIDENCE_DIR/baseline/compiler.log"
            export PLAYINTEGRITY_PROTOCOL_EVIDENCE="$EVIDENCE_DIR/header-candidate"
            export PLAYINTEGRITY_HEADER_REPAIR=1
            set +e
            python3 "$HARNESS_FILE" -v \
              2>&1 | tee "$EVIDENCE_DIR/header-candidate/unittest.log"
            candidate_exit="${PIPESTATUS[0]}"
            set -e
            echo "TCP_ACTUAL_EVIDENCE=header-candidate" >> "$GITHUB_ENV"
            echo "TCP_ACTUAL_EXIT=$candidate_exit" >> "$GITHUB_ENV"
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          (Path(os.environ["EVIDENCE_DIR"])/"baseline-exit.json").write_text(
              json.dumps({"exit_code":int(os.environ["TCP_BASELINE_EXIT"]),"source_patch":False},indent=2)+"\n")
          PY
      - name: Retain actual contract result and source profiles
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ["EVIDENCE_DIR"]);out.mkdir(parents=True,exist_ok=True)
          problems=[];selected=os.environ.get("TCP_ACTUAL_EVIDENCE")
          def read(path):return json.loads(path.read_text()) if path.is_file() else None
          result=read(out/selected/"contract-result.json") if selected else None
          baseline=read(out/"baseline/source-and-compile.json")
          candidate=read(out/"header-candidate/source-and-compile.json")
          if os.environ.get("TCP_ACTUAL_EXIT")!="0":problems.append("Contract process did not exit zero")
          if not result or not result.get("passed") or result.get("frames")!=3 or result.get("fake_dispatch_count")!=2:
            problems.append("No complete three-frame/two-dispatch result")
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          linked_changed=subprocess.check_output(["git","-C","linked-playintegrity","diff","--name-only"],text=True).splitlines()
          if changed or linked_changed:problems.append("Checkout source changed")
          summary={"sources":read(out/"source.json"),"baseline_compile":baseline,"candidate_compile":candidate,
                   "selected_profile":selected,"actual_exit":os.environ.get("TCP_ACTUAL_EXIT"),"contract":result,
                   "problems":problems,"ended_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   "boundary":"Actual one-shot C++ TCP relay, host logging/JNI declarations and fake dispatch; no Android/Google VM or attestation"}
          (out/"summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          files=[p for p in out.rglob("*") if p.is_file()]
          (out/"SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+str(p.relative_to(out))+"\n" for p in sorted(files)))
          print(json.dumps(summary,indent=2))
          if problems:raise SystemExit(1)
          PY
      - name: Upload complete source and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dott3841-linked-tcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
