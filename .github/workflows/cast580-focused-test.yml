name: Cast 580 focused unit tests

on:
  push:
    branches:
      - codex/cast-580-remote-playback-validation-20261004-01

permissions:
  contents: read

jobs:
  cast-core-unit-tests:
    name: Cast core focused JUnit suite
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run focused Cast core unit tests
        run: ./gradlew :play-services-cast:core:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cast580-remote-playback-junit
          path: play-services-cast/core/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14