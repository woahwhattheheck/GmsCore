name: Wear3852 source-pinned full validation
on:
  push:
    branches:
      - validation/wear3852-full-1062b78-20261004
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"
      SOURCE_PIN: "1062b78d9cb7c6cd28afb3f342dbd4b87998e936"
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v7
        with:
          ref: 1062b78d9cb7c6cd28afb3f342dbd4b87998e936
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Record source and execution environment
        shell: bash
        run: |
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$SOURCE_PIN"
          test -z "$(git status --porcelain --untracked-files=no)"
          {
            date -u
            git rev-parse HEAD HEAD^{tree}
            git status --porcelain --untracked-files=no
            java -version
            ./gradlew --version
            df -h
          } > evidence/environment.log 2>&1
          cat evidence/environment.log
      - name: Core and API tests, instrumentation compilation, APK assembly
        id: gradle
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache --max-workers=2 --console=plain --stacktrace --continue \
            :play-services-wearable-core:testDebugUnitTest \
            :play-services-wearable:testDebugUnitTest \
            :play-services-wearable-core:compileDebugAndroidTestJavaWithJavac \
            :play-services-core:assembleVtmDefaultDebug 2>&1 | tee evidence/gradle.log
          status=$?
          echo "$status" > evidence/gradle-exit-code.txt
          exit "$status"
      - name: Collect actual test counts and artifact hashes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, xml.etree.ElementTree as ET
          evidence = pathlib.Path("evidence")
          evidence.mkdir(exist_ok=True)
          result = {
              "source_pin": os.environ["SOURCE_PIN"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "run_url": f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "physical_watch_acceptance": "not tested",
              "gradle_exit_code": int((evidence/"gradle-exit-code.txt").read_text()) if (evidence/"gradle-exit-code.txt").exists() else None,
              "modules": {}, "apks": []
          }
          for name, module in [("core", "play-services-wearable/core"), ("api", "play-services-wearable")]:
              files = sorted(pathlib.Path(module, "build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
              stats = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0, "suites": []}
              for path in files:
                  root = ET.parse(path).getroot()
                  suite = {"name": root.attrib.get("name"), **{k: int(root.attrib.get(k, 0)) for k in ["tests", "failures", "errors", "skipped"]}}
                  suite["failed_cases"] = [{"name": case.attrib.get("name"), "message": node.attrib.get("message")} for case in root.findall("testcase") for node in list(case) if node.tag in ("failure", "error")]
                  stats["suites"].append(suite)
                  for key in ["tests", "failures", "errors", "skipped"]:
                      stats[key] += suite[key]
                  target = evidence/"test-results"/name/path.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
              stats["passed"] = stats["tests"] - stats["failures"] - stats["errors"] - stats["skipped"]
              stats["xml_files"] = len(files)
              result["modules"][name] = stats
          for path in sorted(pathlib.Path("play-services-core/build/outputs/apk").rglob("*.apk")):
              sha = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024*1024), b""):
                      sha.update(block)
              result["apks"].append({"path": str(path), "bytes": path.stat().st_size, "sha256": sha.hexdigest()})
          (evidence/"results.json").write_text(json.dumps(result, indent=2)+"\n")
          (evidence/"SHA256SUMS").write_text("".join(f'{apk["sha256"]}  {apk["path"]}\n' for apk in result["apks"]))
          print(json.dumps(result, indent=2))
          summary = ["## Wear3852 combined validation", f'Source: {result["source_pin"]}', f'Gradle exit: {result["gradle_exit_code"]}', "| Module | Passed | Failed | Errors | Skipped | Total |", "|---|---:|---:|---:|---:|---:|"]
          for name, stats in result["modules"].items():
              summary.append(f'| {name} | {stats["passed"]} | {stats["failures"]} | {stats["errors"]} | {stats["skipped"]} | {stats["tests"]} |')
          for apk in result["apks"]:
              summary.extend([f'APK: {apk["path"]} ({apk["bytes"]} bytes)', f'SHA-256: {apk["sha256"]}'])
          summary.append("Instrumentation Java compilation only; no physical-watch acceptance was tested.")
          (evidence/"SUMMARY.md").write_text("\n\n".join(summary)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("\n\n".join(summary)+"\n")
          PY
          git diff --exit-code
          git status --porcelain --untracked-files=no > evidence/source-status-after.log
      - name: Upload logs, test XML, source pin, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear3852-evidence-1062b78
          path: evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Upload assembled APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear3852-apk-1062b78
          path: play-services-core/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
